apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.name" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.credentials.database }}
  POSTGRES_USER: {{ .Values.credentials.username }}
  POSTGRES_PASSWORD: {{ .Values.credentials.password }}
