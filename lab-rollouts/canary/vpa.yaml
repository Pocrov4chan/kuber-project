apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: podinfo
  namespace: lab-canary
spec:
  targetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: podinfo
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
    - containerName: podinfo
      minAllowed:
        cpu: 25m
        memory: 32Mi
      maxAllowed:
        cpu: 500m
        memory: 256Mi
      controlledResources: ["cpu", "memory"]
