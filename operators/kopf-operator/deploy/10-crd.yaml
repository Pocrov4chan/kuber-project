apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: debugsessions.platform.pocrov4chan.io
spec:
  group: platform.pocrov4chan.io
  scope: Namespaced
  names:
    kind: DebugSession
    plural: debugsessions
    singular: debugsession
    shortNames: [dbs]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [podName, targetPort]
              properties:
                podName:
                  type: string
                  description: "Name of the Pod to expose."
                targetPort:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: "Container port on the Pod to forward to."
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Pod
          type: string
          jsonPath: .spec.podName
        - name: Port
          type: integer
          jsonPath: .spec.targetPort
        - name: NodePort
          type: integer
          jsonPath: .status.create_debug_session.nodePort
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
