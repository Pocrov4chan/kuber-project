apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pocrov4chan/kuber-project.git
    targetRevision: HEAD
    path: operators/kopf-operator/deploy
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
