apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-bluegreen
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pocrov4chan/kuber-project
    path: lab-rollouts/bluegreen
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-bluegreen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
