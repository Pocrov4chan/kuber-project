apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.1
    helm:
      values: |
        crds:
          enabled: true
        defaultRules:
          create: false
        alertmanager:
          enabled: false
        additionalPrometheusRulesMap:
          homelab-rules:
            groups:
              - name: homelab.rules
                rules:
                  - alert: KubePodCrashLooping
                    expr: |
                      max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
                      description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been in CrashLoopBackOff for 10 minutes."
        prometheus:
          prometheusSpec:
            retention: 6h
            replicas: 1
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        grafana:
          enabled: true
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            storageClassName: longhorn
            size: 2Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.local
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc:3100
              isDefault: false
              editable: false
          extraSecretMounts:
            - name: grafana-oidc
              secretName: grafana-oidc
              mountPath: /etc/secrets/grafana-oidc
              readOnly: true
          grafana.ini:
            server:
              root_url: https://grafana.local
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              allow_sign_up: true
              client_id: grafana
              client_secret: $__file{/etc/secrets/grafana-oidc/client-secret}
              scopes: openid profile email
              auth_url: https://keycloak.local/realms/homelab/protocol/openid-connect/auth
              token_url: http://helm-app-keycloak.keycloak-app.svc.cluster.local:8080/realms/homelab/protocol/openid-connect/token
              api_url: http://helm-app-keycloak.keycloak-app.svc.cluster.local:8080/realms/homelab/protocol/openid-connect/userinfo
              role_attribute_path: "'Admin'"
        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
