apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik 
    targetRevision: 39.0.7
    helm:
      values: |
        service:
          type: NodePort
        ports:
          web:
            nodePort: 30528
          websecure:
            nodePort: 30680
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
